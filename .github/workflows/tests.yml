name: Tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: ${{ matrix.os }} / Go ${{ matrix.go }} / Python ${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            go: '1.22.x'
            python: '3.9'
          - os: ubuntu-latest
            go: stable
            python: '3.x'
          - os: macos-latest
            go: stable
            python: '3.x'
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: ${{ matrix.go }}
          cache: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: ${{ matrix.python }}
      - name: Check formatting and shell syntax
        run: |
          test -z "$(gofmt -l cmd)"
          sh -n examples/chatgpt-connector.sh
          git diff --check
      - name: Vet, build, and race-test Go
        run: |
          go vet ./...
          go build -o routeinlet ./cmd/routeinlet
          go test -race ./... -count=1
      - name: Test probe and process lifecycle offline
        run: python3 -m unittest discover -s examples -p 'test_*.py' -v
