name: SIWC connector patch

on:
  pull_request:
    paths:
      - 'patches/cliproxyapi/**'
      - 'scripts/prepare-siwc-connector.sh'
      - '.github/workflows/siwc-connector.yml'
  push:
    branches: [main]
    paths:
      - 'patches/cliproxyapi/**'
      - 'scripts/prepare-siwc-connector.sh'
      - '.github/workflows/siwc-connector.yml'

permissions:
  contents: read

concurrency:
  group: siwc-connector-${{ github.ref }}
  cancel-in-progress: true

jobs:
  connector:
    name: SIWC patch / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version: '1.26.10'
          cache: false
      - name: Prepare pinned connector with verification patch
        run: |
          sh -n scripts/prepare-siwc-connector.sh
          sh scripts/prepare-siwc-connector.sh "$RUNNER_TEMP/siwc-connector"
      - name: Compare upstream management test race
        if: matrix.os == 'ubuntu-latest'
        working-directory: ${{ runner.temp }}/siwc-connector
        run: |
          git worktree add --detach "$RUNNER_TEMP/siwc-baseline" 9a8ca1b577ef8573c5ccf108450b93ed57716cc4
          cd "$RUNNER_TEMP/siwc-baseline"
          if go test -race ./internal/api/handlers/management -run '^TestStartOAuthV8TargetedSessionRegistrationAcrossBuiltinProviders$' -count=10 > "$RUNNER_TEMP/siwc-baseline.log" 2>&1; then
            cat "$RUNNER_TEMP/siwc-baseline.log"
            echo "The intermittent upstream cleanup race did not reproduce in this run."
          else
            cat "$RUNNER_TEMP/siwc-baseline.log"
            # Only the already identified upstream race is informational.
            grep -q 'WARNING: DATA RACE' "$RUNNER_TEMP/siwc-baseline.log"
            grep -q -- '--- FAIL: TestStartOAuthV8TargetedSessionRegistrationAcrossBuiltinProviders' "$RUNNER_TEMP/siwc-baseline.log"
            echo "::warning::Unpatched connector reproduces the unrelated management test cleanup race."
          fi
      - name: Vet, build, and race-test SIWC paths
        working-directory: ${{ runner.temp }}/siwc-connector
        run: |
          go vet ./internal/auth/codex ./internal/cmd ./internal/api/handlers/management
          go build -o test-output ./cmd/server
          rm test-output
          go test -race ./internal/auth/codex ./internal/cmd -count=1 -timeout=15m
          # The full management suite has an upstream xAI fixture cleanup race.
          # Race-check all SIWC cases; the full suite still runs below without -race.
          go test -race ./internal/api/handlers/management -run SIWC -count=1 -timeout=15m
      - name: Test connector suite
        if: matrix.os == 'ubuntu-latest'
        working-directory: ${{ runner.temp }}/siwc-connector
        run: go test ./... -count=1 -timeout=15m
