name: SIWC connector patch

on:
  pull_request:
    paths:
      - 'patches/cliproxyapi/**'
      - 'scripts/prepare-siwc-connector.sh'
      - '.github/workflows/siwc-connector.yml'
  push:
    branches: [main]
    paths:
      - 'patches/cliproxyapi/**'
      - 'scripts/prepare-siwc-connector.sh'
      - '.github/workflows/siwc-connector.yml'

permissions:
  contents: read

concurrency:
  group: siwc-connector-${{ github.ref }}
  cancel-in-progress: true

jobs:
  connector:
    name: SIWC patch / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version: '1.26.10'
          cache: false
      - name: Prepare pinned connector with verification patch
        run: |
          sh -n scripts/prepare-siwc-connector.sh
          sh scripts/prepare-siwc-connector.sh "$RUNNER_TEMP/siwc-connector"
      - name: Vet, build, and race-test affected packages
        working-directory: ${{ runner.temp }}/siwc-connector
        run: |
          go vet ./internal/auth/codex ./internal/cmd ./internal/api/handlers/management
          go build -o test-output ./cmd/server
          rm test-output
          go test -race ./internal/auth/codex ./internal/cmd ./internal/api/handlers/management -count=1 -timeout=15m
      - name: Test connector suite
        if: matrix.os == 'ubuntu-latest'
        working-directory: ${{ runner.temp }}/siwc-connector
        run: go test ./... -count=1 -timeout=15m
